<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>project-3</title>
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<form class="form">
			<legend class="form-window">Ваши личные данные
			<label class="form-cell">
				<span class="form-info"> Ваше имя</span>
				<input class="form-data" type="text" placeholder="Имя" name="name" required />
			</label>
			<label class="form-cell">
				<span class="form-info">Ваш возраст</span>
				<input class="form-data" type="number" placeholder="Возраст" name="age" required />
			</label>
			<label class="form-cell">
				<span class="form-info">Ваш номер телефона </span>
				<input class="form-data" type="tel" placeholder="номер телефона" name="phone" required />
			</label>
			<label class="form-cell">
				<span class="form-info">Ваша почта</span>
				<input class="form-data" type="email" placeholder="номер почта" name="email" required />
			</label>
				<label class="form-cell">
                <span class="form-info">Сообщение</span>
					<textarea class="message" placeholder="Ваше сообщение" name="message"></textarea>
				</label>
			<label class=" form-cell">
				<input  class="checkbox" type="checkbox" />
				Я принимаю правила
			</label>
			<button class="button">Отправить</button>
            </legend>
		</form>
	</body>
</html>
